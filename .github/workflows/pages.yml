name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Verify static site
        run: node tests/site.test.mjs && node --test tests/motion.test.mjs
      - name: Verify browser experience
        run: |
          python3 -m http.server 4175 &
          site_pid=$!
          trap 'kill "$site_pid"' EXIT
          browser_dir=$(mktemp -d)
          cp tests/browser.test.mjs "$browser_dir/"
          npm install --prefix "$browser_dir" --no-save --no-package-lock playwright@1.56.1
          "$browser_dir/node_modules/.bin/playwright" install --with-deps chromium
          SITE_URL=http://127.0.0.1:4175 node "$browser_dir/browser.test.mjs"
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
